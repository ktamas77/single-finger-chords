name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # the release step creates a tag and attaches the built device

concurrency: ci-${{ github.ref }} # one release at a time

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --version && node test.js # tests the engine, then builds and checks dist/Single Finger.amxd

      # Auto-release: every push to main whose build differs from the latest release gets the next
      # patch version. The build is deterministic, so docs-only commits release nothing.
      # The device is zipped because GitHub replaces spaces in asset names with dots, and Live
      # shows the file name as the device title.
      - name: Release if the device changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$last" ] && gh release download "$last" --pattern Single-Finger.zip --dir prev \
              && unzip -q prev/Single-Finger.zip -d prev \
              && cmp -s "prev/Single Finger.amxd" "dist/Single Finger.amxd"; then
            echo "Device unchanged since $last: nothing to release."
            exit 0
          fi
          if [ -z "$last" ]; then next=v1.0.0; else next="${last%.*}.$(( ${last##*.} + 1 ))"; fi
          (cd dist && zip Single-Finger.zip "Single Finger.amxd")
          gh release create "$next" dist/Single-Finger.zip --target "$GITHUB_SHA" --title "Single Finger $next" --generate-notes
